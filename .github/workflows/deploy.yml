# Deploy automático a GitHub Pages en cada push a main.
# Las variables VITE_* salen de los secretos del repo (ver README).
name: Deploy a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck + build
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VITE_N8N_GENERAR_URL: ${{ secrets.N8N_GENERAR_URL }}
          VITE_N8N_AJUSTAR_URL: ${{ secrets.N8N_AJUSTAR_URL }}
          VITE_N8N_IA_URL: ${{ secrets.N8N_IA_URL }}
          # URL pública del webhook de publicación (no es secreto: exige el token de sesión de Elías)
          VITE_N8N_PUBLICAR_URL: https://devn8n.tuescuelademarcas.cl/webhook/tem-redes/publicar
        run: npm run build
      - name: Publicar en gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
