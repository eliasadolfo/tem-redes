# Latido diario: una consulta mínima a Supabase para que el proyecto gratuito
# no se pause por inactividad (el plan Free pausa tras ~7 días sin tráfico).
# La consulta devuelve [] por RLS, pero igual cuenta como actividad.
name: Latido Supabase (evita pausa)

on:
  schedule:
    - cron: "0 11 * * *" # 11:00 UTC = 08:00 Chile (ajusta si cambia el huso)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta mínima a la API
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -e
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "$URL/rest/v1/tem_connections?select=network&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "Supabase respondió HTTP $code"
          # 200 = OK; 401/403 también significan que el proyecto está despierto.
          case "$code" in 200|401|403) exit 0 ;; *) exit 1 ;; esac
